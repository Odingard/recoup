name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0647036765
  REGION: us-central1
  SERVICE: recoup

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOYER_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            secretmanager.googleapis.com \
            aiplatform.googleapis.com \
            --project $PROJECT_ID

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Create Artifact Registry repository (idempotent)
        run: |
          gcloud artifacts repositories create recoup \
            --repository-format=docker \
            --location=$REGION \
            --project=$PROJECT_ID \
            --quiet 2>/dev/null || true

      - name: Build and push image
        run: |
          IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/recoup/$SERVICE:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Write secrets to Secret Manager (idempotent)
        # Secrets are passed through env (never interpolated into the script body):
        # inline ${{ secrets.* }} substitution mangles JSON values containing quotes/newlines.
        env:
          BILLING_KEY: ${{ secrets.RECOUP_BILLING_STRIPE_API_KEY }}
          APP_CLIENT_ID: ${{ secrets.RECOUP_STRIPE_APP_CLIENT_ID }}
          APP_SECRET: ${{ secrets.RECOUP_STRIPE_APP_SECRET }}
          STATE_SECRET: ${{ secrets.RECOUP_STRIPE_APP_STATE_SECRET }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          write_secret() {
            local name=$1 val=$2
            if [ -n "$val" ]; then
              if gcloud secrets describe "$name" --project=$PROJECT_ID &>/dev/null; then
                printf '%s' "$val" | gcloud secrets versions add "$name" --data-file=- --project=$PROJECT_ID
              else
                printf '%s' "$val" | gcloud secrets create "$name" --data-file=- --replication-policy=automatic --project=$PROJECT_ID
              fi
            fi
          }
          write_secret recoup-billing-stripe-key   "$BILLING_KEY"
          write_secret recoup-stripe-app-client-id "$APP_CLIENT_ID"
          write_secret recoup-stripe-app-secret    "$APP_SECRET"
          write_secret recoup-stripe-state-secret  "$STATE_SECRET"
          # Report-share signing key: generated once per project, never rotated by deploy.
          if ! gcloud secrets describe recoup-report-share-secret --project=$PROJECT_ID &>/dev/null; then
            openssl rand -hex 32 | tr -d '\n' | gcloud secrets create recoup-report-share-secret --data-file=- --replication-policy=automatic --project=$PROJECT_ID
          fi
          if [ -n "$FIREBASE_SA_JSON" ]; then
            if printf '%s' "$FIREBASE_SA_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("type")=="service_account" and d.get("private_key")'; then
              write_secret firebase-sa-json "$FIREBASE_SA_JSON"
            else
              echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON is not a valid service-account JSON key; keeping the existing Secret Manager version."
            fi
          fi

      - name: Grant Cloud Run SA access to secrets
        run: |
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
          COMPUTE_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          RUNTIME_SA="recoup-backend@${PROJECT_ID}.iam.gserviceaccount.com"

          for secret in recoup-billing-stripe-key recoup-stripe-app-client-id recoup-stripe-app-secret recoup-stripe-state-secret recoup-report-share-secret firebase-sa-json; do
            if gcloud secrets describe "$secret" --project=$PROJECT_ID &>/dev/null; then
              for sa in "$RUNTIME_SA" "$COMPUTE_SA"; do
                gcloud secrets add-iam-policy-binding "$secret" \
                  --member="serviceAccount:$sa" \
                  --role="roles/secretmanager.secretAccessor" \
                  --project=$PROJECT_ID \
                  --condition=None 2>/dev/null || true
              done
            fi
          done

      - name: Deploy to Cloud Run
        run: |
          SECRETS_LIST="RECOUP_REPORT_SHARE_SECRET=recoup-report-share-secret:latest,RECOUP_STRIPE_APP_CLIENT_ID=recoup-stripe-app-client-id:latest,RECOUP_STRIPE_APP_SECRET=recoup-stripe-app-secret:latest,RECOUP_STRIPE_APP_STATE_SECRET=recoup-stripe-state-secret:latest,FIREBASE_SERVICE_ACCOUNT_JSON=firebase-sa-json:latest"
          if gcloud secrets describe recoup-billing-stripe-key --project=$PROJECT_ID &>/dev/null; then
            SECRETS_LIST="RECOUP_BILLING_STRIPE_API_KEY=recoup-billing-stripe-key:latest,$SECRETS_LIST"
          fi

          RUNTIME_SA="recoup-backend@${PROJECT_ID}.iam.gserviceaccount.com"

          gcloud run deploy $SERVICE \
            --image $IMAGE \
            --region $REGION \
            --project $PROJECT_ID \
            --platform managed \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --set-env-vars "^|^\
          GOOGLE_GENAI_USE_VERTEXAI=TRUE|\
          GOOGLE_CLOUD_PROJECT=$PROJECT_ID|\
          GOOGLE_CLOUD_LOCATION=$REGION|\
          RECOUP_SAMPLE_MODE=0|\
          RECOUP_BILLING_SOURCE=stripe|\
          RECOUP_STRIPE_APP_REDIRECT_URI=https://recoup.odingard.com/api/connector/stripe/oauth/callback|\
          RECOUP_STRIPE_APP_AUTHORIZE_URL=https://marketplace.stripe.com/oauth/v2/authorize|\
          RECOUP_STRIPE_APP_TOKEN_URL=https://api.stripe.com/v1/oauth/token|\
          RECOUP_WEB_BASE_URL=https://recoup.odingard.com|\
          RECOUP_OPERATOR_EMAILS=${{ vars.RECOUP_OPERATOR_EMAILS || 'andrebyrd87@gmail.com,andre.byrd@odingard.com' }}|\
          RECOUP_GIT_SHA=${{ github.sha }}" \
            --set-secrets "$SECRETS_LIST" \
            --min-instances 0 \
            --max-instances 4 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300

      - name: Grant Vertex AI and Cloud permissions to runtime SA
        run: |
          RUNTIME_SA="recoup-backend@${PROJECT_ID}.iam.gserviceaccount.com"
          for role in roles/aiplatform.user roles/datastore.user; do
            gcloud projects add-iam-policy-binding $PROJECT_ID \
              --member="serviceAccount:$RUNTIME_SA" \
              --role="$role" \
              --condition=None 2>/dev/null || true
          done

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe $SERVICE --region $REGION --project $PROJECT_ID --format='value(status.url)')
          echo "✅ Deployed: $URL"
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV
